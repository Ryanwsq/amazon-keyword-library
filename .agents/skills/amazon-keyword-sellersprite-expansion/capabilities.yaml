skill:
  name: amazon-keyword-sellersprite-expansion
  maturity: draft
  last_verified: null
capabilities:
  - id: keyword.source.keyword-mining.query
    type: mcp
    purpose: 通过获准卖家精灵适配器以四字段有界Pass逐页挖掘主任务确认的代表种子
    status: planned
    input: 站点、查询月份、单个代表种子、Pass、页码、每页20条和固定returnFields参数
    output: 单页英文关键词、中文翻译、ABA月排名、月搜索量、声明总数页数、分页状态和错误状态
    permission: approved-read
    risk: 不自行选择种子或请求其他字段；缺页、循环、整页重复或无进展时只阻断受影响Pass
  - id: keyword.source.sellersprite.paginate-and-verify
    type: manual
    purpose: 保存并核对卖家精灵逐页实际响应，机械融合并装配四字段工作簿
    status: planned
    input: 逐页原始响应、Run_ID、查询月份、代表种子、Pass、站点和本机忽略目录
    output: 版本化原始页、实际行数闭环、四字段工作簿、重复/缺失/冲突/损失清单和紧凑主任务回传
    permission: local-draft
    risk: 不删除原始重复、不补0或精确词重拉；主任务回传不展开业务长响应；分页门失败时不得宣称完成
