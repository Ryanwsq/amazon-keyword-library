skill:
  name: amazon-keyword-sellersprite-expansion
  maturity: draft
  last_verified: null
capabilities:
  - id: keyword.source.keyword-mining.query
    type: mcp
    purpose: 通过获准卖家精灵适配器逐页挖掘主任务确认的代表种子
    status: planned
    input: 站点、单个代表种子、页码和每页20条参数
    output: 单页全部关键词行、完整字段、声明总数页数、分页状态和错误状态
    permission: approved-read
    risk: 不自行选择种子；缺页、循环、整页重复、页数变化或无最后页时停止
  - id: keyword.source.sellersprite.paginate-and-verify
    type: manual
    purpose: 保存并核对卖家精灵逐页原始响应、实际行数、重复、漂移和字段缺失
    status: planned
    input: 逐页原始响应、Run_ID、代表种子、站点和本机忽略目录
    output: 版本化原始页、实际行数闭环、重复组、缺失字段表、异常和主任务回传
    permission: local-draft
    risk: 不删除原始重复、不补0或精确词重拉；分页门失败时不得宣称完成
