skill:
  name: amazon-keyword-trend-analysis
  maturity: draft
  last_verified: null
capabilities:
  - id: keyword.library.trend.analyze
    type: manual
    purpose: 协调Sheet2 F1至F3品类历年月度搜索量矩阵和单一折线图输出
    status: planned
    input: 锁定的F1至F3人口、Keyword_ID、站点、月份范围和趋势查询批次
    output: 一个品类趋势Sheet、月度矩阵、折线图、缺失和完整性状态
    permission: approved-read-and-local-draft
    risk: 只用卖家精灵月度搜索量；月份无效时不生成图；不输出趋势标签或广告动作
  - id: keyword.trend.sellersprite-aba.query
    type: mcp
    purpose: 获取F1至F3完整关键词的卖家精灵历年月度搜索量
    status: planned
    input: 目标站点、单个完整关键词和月度粒度
    output: 月份非空且可解析的月度搜索量、可用年月和数据周期
    permission: approved-read
    risk: 唯一正式来源；失败时不回退SIF或其他平台，不自行生成月份
  - id: keyword.trend.output.write-and-verify
    type: manual
    purpose: 写入并验证一个品类F1至F3趋势Sheet、月度矩阵和多序列折线图
    status: planned
    input: F1至F3人口、月度搜索量、来源周期、月份范围和缺失状态
    output: 月度矩阵、折线图、关键词月份序列闭环和主任务回传
    permission: local-draft-and-verify
    risk: 不混入F4/F5/Sheet3/Sheet4；不写回最终总表；不生成趋势标签
