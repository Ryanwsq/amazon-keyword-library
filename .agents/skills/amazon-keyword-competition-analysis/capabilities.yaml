skill:
  name: amazon-keyword-competition-analysis
  maturity: draft
  last_verified: null
capabilities:
  - id: keyword.library.competition.analyze
    type: manual
    purpose: 协调Sheet2 F1至F4独立Top3竞争分析并按正式输出门形成可复算结论
    status: planned
    input: 锁定的F1至F4分类人口、Keyword_ID、第一板块SIF Top3字段、站点和周期
    output: 独立竞争Sheet、综合等级或阻断状态、摘要、完整性和复核结果
    permission: approved-read-and-local-draft
    risk: 不读取SKU事实卡；Top3任一缺失或冲突未解决时不出综合等级；不输出广告资格
  - id: keyword.competition.sif-top3.query
    type: mcp
    purpose: 通过SIF关键词历史接口批量补齐完整词最新Top3点击与转化份额
    status: planned
    input: 站点、每批1至10个缺失或冲突的完整关键词和周粒度
    output: 完整原始响应，以及每词latest日期、Top3点击份额和Top3转化份额
    permission: approved-read
    risk: 只读latest三字段；不使用历史均值、近似词或接口预计算结论替代
  - id: keyword.competition.outputs.write-and-verify
    type: manual
    purpose: 写入并验证独立F1至F4竞争Sheet的Top3来源、派生等级和写回字段
    status: planned
    input: 分类人口、Top3两项正式输入、来源周期、规则版本和异常
    output: 竞争Sheet、人口主键闭环、样本门、完整性、置信度和主任务回传
    permission: local-draft-and-verify
    risk: 不覆盖分类表；Top3任一缺失、冲突未解决或周期不明时不得写综合等级
