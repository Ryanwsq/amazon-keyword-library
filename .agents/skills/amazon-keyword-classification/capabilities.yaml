skill:
  name: amazon-keyword-classification
  maturity: draft
  last_verified: null

capabilities:
  - id: keyword.library.classify
    type: manual
    purpose: 协调Sheet2核心词、Sheet4二类词和Sheet3否词候选的第三板块分类输出
    status: planned
    input: 锁定的Sheet2/3/4、稳定Keyword_ID、规范ABA/搜索量、来源周期和分类版本
    output: 三张分类过程Sheet、异常清单和质检结果
    permission: local-draft
    risk: 不读取SKU事实卡；不改变第二板块身份；未确认边界进入人工复核
  - id: keyword.classification.sheet2.apply
    type: manual
    purpose: 为Sheet2关键词应用F1至F5流量层、多标签、F5唯一主分组标签和标签内LT分组
    status: planned
    input: Sheet2唯一关键词、ABA排名、翻译、来源和周期
    output: 一词一行且F5每词只出现一次的Sheet2分类过程表
    permission: local-draft
    risk: 无ABA时不得伪造排名；F5主标签必须按固定优先级且每个标签内子组最多20词
  - id: keyword.classification.sheet4.apply
    type: manual
    purpose: 为Sheet4二类词应用独立F1至F5流量层、F5主标签和标签内LT分组
    status: planned
    input: Sheet4唯一关键词、ABA排名和替代关系字段
    output: 独立二类词流量分类表
    permission: local-draft
    risk: 不改写二类词身份；不加入竞争或趋势分析
  - id: keyword.classification.sheet3.prepare
    type: manual
    purpose: 建立Sheet3否词候选设计结构并记录误伤检查和复核状态
    status: planned
    input: Sheet3关键词、摘除原因、Sheet2和Sheet4保留表达
    output: 否词候选设计表和人工复核清单
    permission: local-draft
    risk: 未确认精准和词组否定边界前不得输出可直接投放结论
  - id: keyword.classification.outputs.write-and-verify
    type: manual
    purpose: 写入并验证三张分类过程Sheet的人口、主键、分层、标签和范围
    status: planned
    input: 三张上游Sheet、分类结果、异常和规则版本
    output: 分类过程Sheet、行数闭环、术语检查和异常报告
    permission: local-draft-and-verify
    risk: 不覆盖上游工作簿；主键或人口不闭合时阻断交付
